packages:
  - packages/*
  - scripts

catalog:
  capnweb: ^0.12.0
  capnweb-validate: 0.3.0
  typescript: 7.0.2
  vite: 7.3.6
  vite-plus: ^0.2.8
  vitest: ^4.1.10

overrides:
  vite: "catalog:"
  '@types/node': 26.1.0
  '@lezer/markdown': 1.6.4

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - capnweb
  - capnweb-validate

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: set this to true or false
