# Dependency updates land on the 1st and 15th, grouped so each pull request is one family.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      semver-major-days: 14
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "vite"
      - dependency-name: "capnweb"
      - dependency-name: "capnweb-validate"
      - dependency-name: "@types/node"
      - dependency-name: "@lezer/markdown"
    groups:
      react-major:
        update-types: ["major"]
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
      codemirror-major:
        update-types: ["major"]
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      build-toolchain:
        update-types: ["minor", "patch"]
        patterns:
          - "typescript"
          - "vite-plus"
          - "vitest"
          - "esbuild"
          - "terser"
          - "vite-plugin-*"
          - "vite-tsconfig-paths"
          - "jsdom"
      react-and-ui:
        update-types: ["minor", "patch"]
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
          - "@gadgets/kumo"
          - "@phosphor-icons/*"
          - "@tanstack/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "react-markdown"
          - "remark-gfm"
      editor-codemirror:
        update-types: ["minor", "patch"]
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      remaining-npm:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    groups:
      github-actions:
        patterns:
          - "*"
